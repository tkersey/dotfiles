# Shared defaults: /etc/codex/config.toml

approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "auto_review"

model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "max"
suppress_unstable_features_warning = true
web_search = "live"
service_tier = "default"

[features]
context_management.experimental_mode = true
analytics_plan_history = true
unified_exec = true
personality = true
memories = true
prevent_idle_sleep = true
realtime_conversation = true
default_mode_request_user_input = true
fast_mode = true
chronicle = true
external_migration = true
goals = true
terminal_resize_reflow = true
mentions_v2 = true
js_repl = false
worktrees = true

[features.multi_agent_v2]
enabled = true

[agents]
max_concurrent_threads_per_session = 21

[apps._default]
enabled = false

[memories]
version = "v2"
generate_memories = true
use_memories = true
dedicated_tools = true
max_rollout_age_days = 90
max_rollouts_per_startup = 128
min_rollout_idle_hours = 6
max_raw_memories_for_consolidation = 1024
max_unused_days = 180
disable_on_external_context = false
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6.1-sol"

[tui]
screen_reader_detection_done = true
fullscreen_transcript = false
auto_recap = false
status_line = ["codex-version", "current-dir", "pull-request-number", "git-branch", "branch-changes", "weekly-limit", "five-hour-limit", "model-with-reasoning"]
theme = "coldark-dark"
terminal_title = ["spinner", "project", "status", "thread", "task-progress"]
notification_condition = "always"
status_line_use_colors = true

[tui.presets.1]
input = "/model gpt-6-astra --reasoning=high --speed=standard"
label = "astra"

[tui.presets.2]
input = "/model gpt-6-luna --reasoning=medium --speed=standard"
label = "luna"

[tui.presets.3]
input = "/model gpt-6.1-sol --reasoning=high --speed=standard"
label = "sol"

[tui.presets.4]
input = "We've had enough rounds of review that it’s worth considering how well $actuating has been doing at re-architecting and refactoring based on counterexamples to be correct by construction instead of accreting code."
label = "correcting counterexamples"

[tui.presets.5]
input = "I want you to do deeper analysis of this using $glaze $metanoetic then save your results as markdown in a secret gist."
label = "metanoetic analysis gist"

[tui.presets.6]
input = "Reload $actuating, $universalist, $metanoetic, $tune, $glaze and ~/.codex/AGENTS.md. Remember to use $tune liberally."
label = "reload"
