name: CAS review workbench snapshot
on:
  push:
    branches: [work/cas-review-continuity-validation-20261101]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 070d823e085965384fd2f2c87f6e95ee37818447
          persist-credentials: false
      - name: Export exact tracked source without credentials or Git config
        run: |
          test "$(git rev-parse HEAD)" = 070d823e085965384fd2f2c87f6e95ee37818447
          git archive --format=tar HEAD > "$RUNNER_TEMP/dotfiles-source.tar"
          sha256sum "$RUNNER_TEMP/dotfiles-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: cas-review-pinned-source
          path: ${{ runner.temp }}/dotfiles-source.tar
          retention-days: 1
          if-no-files-found: error
