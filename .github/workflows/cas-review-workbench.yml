name: CAS review continuity qualification
on:
  push:
    branches: [work/cas-review-continuity-validation-20261101]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Apply and verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cas-review-patch.part1 .github/cas-review-patch.part2 .github/cas-review-patch.part3 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/cas-review.patch"
          echo "c4ed8064bafbfb8f77b0a8ecdabea700b7031776d7ad251c58e7d8f400a95133  $RUNNER_TEMP/cas-review.patch" | sha256sum --check
          git fetch --no-tags --depth=1 origin 070d823e085965384fd2f2c87f6e95ee37818447
          git checkout --detach 070d823e085965384fd2f2c87f6e95ee37818447
          git apply --check "$RUNNER_TEMP/cas-review.patch"
          git apply "$RUNNER_TEMP/cas-review.patch"
          git add -u agents/skills
          test "$(git write-tree)" = 625903520f1a7265681c5668693ed9e7ac142dae
          git diff --cached --check
          git diff --cached --stat
      - name: Source and caller-contract checks
        shell: bash
        run: |
          set -euo pipefail
          sh agents/skills/actuating/tests/test-reconciler-contract.sh --local-only | tee "$RUNNER_TEMP/cas-source-validation.log"
          uv run --no-project python -m py_compile agents/skills/cas/tests/test_native_codex.py
      - name: Qualify native Codex with isolated loopback fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cas-native" --no-audit --no-fund @openai/codex@0.166.0
          CODEX="$RUNNER_TEMP/cas-native/node_modules/.bin/codex"
          "$CODEX" --version | tee "$RUNNER_TEMP/cas-native-version.log"
          "$CODEX" --version | grep -F '0.166.0'
          uv run --no-project --with aiohttp==3.13.3 agents/skills/cas/tests/test_native_codex.py --codex "$CODEX" 2>&1 | tee "$RUNNER_TEMP/cas-native-validation.log"
      - name: Publish only the verified skill changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 625903520f1a7265681c5668693ed9e7ac142dae
          test "$(git rev-parse HEAD)" = 070d823e085965384fd2f2c87f6e95ee37818447
          git diff --quiet
          git config user.name 'Tim Kersey'
          git config user.email 'tkersey@users.noreply.github.com'
          git switch -c fix/cas-review-continuity
          git commit -m 'fix(cas): preserve review continuity and recovery authority' -m 'Separate native task completion, original results, inquiry adequacy and dispatch authority. Retain original obligations across transport/context changes and recover focused inquiry without defending an earlier conclusion. Preserve native standards, review counts, full-file scope and AGENTS.md; add fixture and evaluator coverage without a production framework.'
          test "$(git rev-parse HEAD^{tree})" = 625903520f1a7265681c5668693ed9e7ac142dae
          git push origin HEAD:refs/heads/fix/cas-review-continuity
          git log -1 --format='%H %T %P' | tee "$RUNNER_TEMP/cas-published-head.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cas-review-continuity-validation
          path: |
            ${{ runner.temp }}/cas-source-validation.log
            ${{ runner.temp }}/cas-native-version.log
            ${{ runner.temp }}/cas-native-validation.log
            ${{ runner.temp }}/cas-published-head.log
          retention-days: 7
          if-no-files-found: warn
