name: Zig skill conformance
on:
  pull_request:
    paths:
      - 'codex/skills/zig/**'
      - 'codex/agents/zig-semantic-failure-auditor.toml'
      - '.github/workflows/zig-skill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: false
      - name: Fetch checksum-pinned Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.17.0.tar.xz"
          curl --fail --location --retry 3 --max-time 120 \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz \
            --output "$archive"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Helper and runner regressions
        run: uv run python -m unittest discover -s codex/skills/zig/tests -p 'test_*.py' -v
      - name: Native debug examples and forced diagnostics
        run: uv run python codex/skills/zig/tests/check_zig_examples.py --optimize debug
      - name: Native safe examples and forced diagnostics
        run: uv run python codex/skills/zig/tests/check_zig_examples.py --optimize safe
      - name: Opposite-endian compile-only regression
        run: zig test codex/skills/zig/references/zig_0_17_regressions.zig -O safe -target aarch64_be-linux-musl --test-no-exec
      - name: Format reference and negative examples
        run: zig fmt --check codex/skills/zig/references codex/skills/zig/tests/compile_fail
      - name: Inspect migration failure against the selected standard library
        if: failure()
        shell: bash
        run: |
          sed -n '730,850p' "$RUNNER_TEMP/zig-x86_64-linux-0.17.0/lib/std/lang.zig"
          for source in codex/skills/zig/references/*.zig; do
            echo "== $source =="
            zig test "$source" -O debug || true
          done
          zig fmt codex/skills/zig/references codex/skills/zig/tests/compile_fail
          git diff -- codex/skills/zig/references codex/skills/zig/tests/compile_fail
