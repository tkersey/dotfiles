name: Finalize Actuating Metanoetic alignment

on:
  push:
    branches:
      - agent/metanoetic-glaze-boundary

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align routing and procedure surfaces
        shell: bash
        run: |
          ruby <<'RUBY'
          # frozen_string_literal: true

          require "fileutils"

          def replace_once!(text, old, replacement, label)
            raise "missing replacement anchor: #{label}" unless text.include?(old)
            text.sub!(old, replacement)
          end

          actuating_path = "codex/skills/actuating/SKILL.md"
          actuating = File.read(actuating_path)
          replace_once!(
            actuating,
            'and integrate one bounded $metanoetic pass when findings or cumulative review-path accretion make abstraction change live.',
            'and integrate one bounded $metanoetic pass when an initial high-regret nomination, accepted findings, causal recurrence, or cumulative review-path accretion makes abstraction change live.',
            "Actuating frontmatter trigger coverage"
          )
          replace_once!(
            actuating,
            'When an accepted-class, recurrence, or review-accretion\n   abstraction-change trigger is present, complete the bounded Metanoetic pass and',
            'When an initial-high-regret, accepted-class, recurrence, or review-accretion\n   abstraction-change trigger is present, complete the bounded Metanoetic pass and',
            "Actuating construction procedure trigger coverage"
          )
          File.write(actuating_path, actuating)

          agent_path = "codex/skills/actuating/agents/openai.yaml"
          agent = File.read(agent_path)
          replace_once!(
            agent,
            'apply one bounded $metanoetic pass when abstraction change is live,',
            'apply one bounded $metanoetic pass when an initial-high-regret or abstraction-change trigger is live,',
            "Actuating UI prompt trigger coverage"
          )
          File.write(agent_path, agent)

          construction_path = "codex/skills/actuating/references/construction-contract.md"
          construction = File.read(construction_path)
          replace_once!(
            construction,
            'once -> Actuating adjudication -> one Construction`. When abstraction change is\nlive, the order is `activate -> axiomatize for the current run -> Universalist',
            'once -> Actuating adjudication -> one Construction`. When an initial-high-regret\nor abstraction-change trigger is live, the order is `activate -> axiomatize for\nthe current run -> Universalist',
            "Construction composition trigger coverage"
          )
          File.write(construction_path, construction)

          ideate_path = "codex/skills/ideate/SKILL.md"
          ideate = File.read(ideate_path)
          replace_once!(
            ideate,
            'Invoke `$metanoetic` directly and run the Glaze prompt gate before choosing;',
            'Invoke `$metanoetic` and `$glaze` directly before choosing;',
            "Ideate routing description"
          )
          File.write(ideate_path, ideate)

          FileUtils.rm_f(".github/workflows/agent-metanoetic-actuating-alignment.yml")
          RUBY

      - name: Validate final alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'initial high-regret nomination, accepted findings, causal recurrence' codex/skills/actuating/SKILL.md
          grep -q 'When an initial-high-regret, accepted-class, recurrence, or review-accretion' codex/skills/actuating/SKILL.md
          grep -q 'initial-high-regret or abstraction-change trigger is live' codex/skills/actuating/agents/openai.yaml
          grep -q 'When an initial-high-regret' codex/skills/actuating/references/construction-contract.md
          grep -q 'Invoke `$metanoetic` and `$glaze` directly before choosing' codex/skills/ideate/SKILL.md
          ruby -rjson -e 'JSON.parse(File.read("codex/skills/actuating/references/decision-contract.json"))'
          git diff --check

      - name: Commit alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align initial Metanoetic trigger surfaces"
          git push origin "HEAD:${{ github.ref_name }}"
