name: Ledger migration conformance
on:
  pull_request:
    paths:
      - 'codex/skills/ledger/**'
      - 'codex/skills/learnings/**'
      - 'codex/skills/negative-ledger/**'
      - '.github/workflows/ledger-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fetch checksum-pinned native Ledger
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ledger-v1.3.0-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/tkersey/skills-zig/releases/download/ledger-v1.3.0/ledger-v1.3.0-linux-x86_64.tar.gz \
            --output "$archive"
          echo "070b95bf0d7b288b1a6235d88ea9019aca08bd9fae4337a5b1878d2aed127ed5  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/native-ledger"
          tar -xzf "$archive" -C "$RUNNER_TEMP/native-ledger"
          mapfile -t binaries < <(find "$RUNNER_TEMP/native-ledger" -type f -name ledger)
          test "${#binaries[@]}" -eq 1
          chmod +x "${binaries[0]}"
          "${binaries[0]}" version --format json
          echo "LEDGER_BIN=${binaries[0]}" >> "$GITHUB_ENV"
      - name: Historical import and native protocol conformance
        run: uv run python -m unittest discover -s codex/skills/learnings/tests -p 'test_retired_import.py' -v
      - name: Context and migration orchestration regressions
        run: uv run python -m unittest discover -s codex/skills/ledger/tests -p 'test_*.py' -v
