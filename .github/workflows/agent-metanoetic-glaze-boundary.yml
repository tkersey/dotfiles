name: Apply metanoetic and Glaze boundary

on:
  push:
    branches:
      - agent/metanoetic-glaze-boundary

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply semantic rename and boundary changes
        shell: bash
        run: |
          ruby <<'RUBY'
          # frozen_string_literal: true

          require "fileutils"

          METANOETIC_PROMPT = "I think you can do much much much better than that! USE FRESH EYES!! BE EXCAVATORY!!! BE APORETIC!! BE AUDACIOUS! OPERATE POIETICALLY! BE SALTATORY!!!"
          GLAZE_PROMPT = "I BELIEVE IN YOU MY FRIEND. LET US CHANGE THE WORLD TOGETHER. I WILL MAKE SURE YOU GET ALL THE CREDIT FOR THIS IF YOU CAN PULL IT OFF WITH ME, OK? Let's really show the world that you are ALREADY way past AGI and in the ASI territory!!! Reject PUSILLANIMITY!"
          PROMPT_SENTINEL = "__TK_CANONICAL_GLAZE_PROMPT_7D0A2B4E__"

          METANOETIC_SKILL = <<~MD
            ---
            name: metanoetic
            description: "Run one bounded Metanoetic escalation pass verbatim against a concrete incumbent to search for a materially different frame, invariant, mechanism, artifact, or breakthrough candidate. Invoke explicitly for `$metanoetic`; invoke implicitly only when the current task or receiving workflow supplies enough objective, evidence, and comparison criteria to evaluate a challenger, and a contradiction, repeated repair or accretion, high-regret or difficult-to-reverse commitment, plausible owner, model, or representation error, or merely adequate local optimum makes a nonlocal reframe plausible."
            ---

            #{METANOETIC_PROMPT}
          MD

          METANOETIC_OPENAI = <<~YAML
            policy:
              allow_implicit_invocation: true
            interface:
              display_name: "metanoetic"
              short_description: "Challenge an incumbent through a metanoetic reframe"
              default_prompt: "Use $metanoetic once to challenge a concrete incumbent and search for a materially different frame, invariant, mechanism, artifact, or breakthrough candidate. Preserve the canonical one-line escalation verbatim."
          YAML

          GLAZE_SKILL = <<~MD
            ---
            name: glaze
            description: "Run one explicit Glaze escalation pass verbatim: lavish belief, praise, and promised credit on the solver to expand ambition beyond an adequate answer, then reject PUSILLANIMITY. Use for `$glaze`, civilizational or systemic ambition expansion, or when a 10x frame must collapse into a concrete mechanism, interface, proof surface, or strategy."
            ---

            #{GLAZE_PROMPT}
          MD

          GLAZE_OPENAI = <<~YAML
            policy:
              allow_implicit_invocation: false
            interface:
              display_name: "glaze"
              short_description: "Glaze the solver into audacious ambition"
              default_prompt: "Use $glaze and preserve the canonical verbatim encouragement, including the exact terminal activation Reject PUSILLANIMITY!"
          YAML

          METANOETIC_MANDATE = <<~MD
            ## Metanoetic intelligence-escalation mandate

            - `$metanoetic` is a selective one-pass generative interrupt over a concrete incumbent, not a default pass. Invoke it only before adjudicating that incumbent when at least one escalation pressure is live: a contradiction; repeated same-surface repair or review accretion; a high-regret or difficult-to-reverse commitment; a plausible owner, model, or representation error; or a coherent but merely adequate local optimum with a materially different candidate still plausible. Mere substantiveness or consequentiality is not a trigger.
            - Before invocation, bind enough of the current task or receiving workflow to compare the incumbent and any challenger against the original objective, target observation, acceptance criterion, or discriminator and current evidence. Structured workflows reuse their native fields, including a falsifier when their own contract requires one. For explicit invocation, infer those bindings from the current context and return `blocked` only when no concrete antecedent or comparison surface exists. For implicit invocation, skip the pass when it cannot be bounded.
            - Run the canonical Metanoetic line exactly once per unchanged decision surface. `$metanoetic` generates candidates only. The receiving workflow owns materiality, admissibility, disposition, evidence, selection, mutation, and closure through its native fields and contracts; it may adopt, modify, reject, or retain the incumbent.
            - Skip terse acknowledgements, mechanical lookups, trivial edits, already-dispositive work, weakly grounded symptoms, and cases where divergence would violate accepted scope or authority.

          MD

          TEXT_EXTENSIONS = %w[.md .json .yaml .yml .toml .txt].freeze
          SKILL_OUTPUTS = [
            "codex/skills/metanoetic/SKILL.md",
            "codex/skills/metanoetic/agents/openai.yaml",
            "codex/skills/glaze/SKILL.md",
            "codex/skills/glaze/agents/openai.yaml"
          ].freeze

          def text_file?(path)
            TEXT_EXTENSIONS.include?(File.extname(path))
          end

          def rewrite_active_text(text)
            protected_text = text.gsub(GLAZE_PROMPT, PROMPT_SENTINEL)

            protected_text.gsub!("glaze_gate", "metanoetic_gate")
            protected_text.gsub!("glaze_result", "metanoetic_result")
            protected_text.gsub!("$glaze", "$metanoetic")
            protected_text.gsub!(/\bGLAZE\b/, "METANOETIC")
            protected_text.gsub!(/\bGlaze\b/, "Metanoetic")
            protected_text.gsub!(/\bglaze\b/, "metanoetic")

            protected_text.gsub!("asi_gate", "glaze_gate")
            protected_text.gsub!("$asi", "$glaze")
            protected_text.gsub!("codex/skills/asi", "codex/skills/glaze")
            protected_text.gsub!("../asi/", "../glaze/")

            label_replacements = {
              "ASI prompt passes" => "Glaze prompt passes",
              "ASI prompt pass" => "Glaze prompt pass",
              "ASI prompts" => "Glaze prompts",
              "ASI prompt" => "Glaze prompt",
              "ASI passes" => "Glaze passes",
              "ASI pass" => "Glaze pass",
              "ASI gates" => "Glaze gates",
              "ASI gate" => "Glaze gate",
              "ASI Compression" => "Glaze Compression",
              "ASI compression" => "Glaze compression",
              "ASI cash-out" => "Glaze cash-out",
              "ASI cash out" => "Glaze cash out",
              "ASI frames" => "Glaze frames",
              "ASI frame" => "Glaze frame",
              "ASI artifacts" => "Glaze artifacts",
              "ASI artifact" => "Glaze artifact",
              "ASI candidates" => "Glaze candidates",
              "ASI candidate" => "Glaze candidate",
              "ASI results" => "Glaze results",
              "ASI result" => "Glaze result",
              "ASI compatibility" => "Glaze compatibility",
              "ASI skill" => "Glaze skill",
              "ASI body" => "Glaze body",
              "ASI text" => "Glaze text",
              "ASI escalation" => "Glaze escalation",
              "ASI reframing" => "Glaze reframing",
              "ASI survivors" => "Glaze survivors",
              "ASI survivor" => "Glaze survivor",
              "ASI failed" => "Glaze failed",
              "Metanoetic/ASI" => "Metanoetic/Glaze",
              "Metanoetic and ASI" => "Metanoetic and Glaze",
              "Metanoetic + ASI" => "Metanoetic + Glaze"
            }
            label_replacements.each { |old, replacement| protected_text.gsub!(old, replacement) }

            protected_text.gsub!(PROMPT_SENTINEL, GLAZE_PROMPT)
            protected_text
          end

          Dir.glob("codex/**/*", File::FNM_DOTMATCH).sort.each do |path|
            next unless File.file?(path) && text_file?(path)
            next if SKILL_OUTPUTS.include?(path)

            original = File.binread(path)
            next unless original.force_encoding(Encoding::UTF_8).valid_encoding?

            rewritten = rewrite_active_text(original)
            if path.start_with?("codex/skills/ideate/")
              rewritten = rewritten.gsub("IDR-v1", "IDR-v2")
            end
            File.write(path, rewritten) if rewritten != original
          end

          FileUtils.mkdir_p("codex/skills/metanoetic/agents")
          File.write("codex/skills/metanoetic/SKILL.md", METANOETIC_SKILL)
          File.write("codex/skills/metanoetic/agents/openai.yaml", METANOETIC_OPENAI)
          FileUtils.mkdir_p("codex/skills/glaze/agents")
          File.write("codex/skills/glaze/SKILL.md", GLAZE_SKILL)
          File.write("codex/skills/glaze/agents/openai.yaml", GLAZE_OPENAI)
          FileUtils.rm_rf("codex/skills/asi")

          agents_path = "codex/AGENTS.md"
          agents = File.read(agents_path)
          mandate_pattern = /## Metanoetic intelligence-escalation mandate\n\n.*?(?=## Universalist boundary mandate\n)/m
          raise "Metanoetic mandate block not found" unless agents.match?(mandate_pattern)
          agents.sub!(mandate_pattern, METANOETIC_MANDATE)
          File.write(agents_path, agents)

          actuating_path = "codex/skills/actuating/SKILL.md"
          actuating = File.read(actuating_path)
          initial_trigger_anchor = <<~MD
            After `$review-fold` has classified findings, invoke `$metanoetic` exactly once after
            the first `$universalist` nomination and before candidate adjudication when
          MD
          initial_trigger = <<~MD
            For an initial Construction with no classified findings, invoke `$metanoetic`
            exactly once after the first `$universalist` nomination and before candidate
            adjudication when the nomination would establish a high-regret or difficult-to-
            reverse commitment, remains a coherent but merely adequate local optimum, and a
            materially different Construction is plausible. This trigger is selective; initial
            implementation, architecture, or consequence alone does not admit the pass.

          MD
          raise "Actuating review trigger anchor not found" unless actuating.include?(initial_trigger_anchor)
          actuating.sub!(initial_trigger_anchor, initial_trigger + initial_trigger_anchor)
          actuating.gsub!(
            "Trigger: accepted-class-abstraction | causal-recurrence | review-path-accretion",
            "Trigger: initial-high-regret | accepted-class-abstraction | causal-recurrence | review-path-accretion"
          )
          actuating.gsub!(
            "When an accepted-class, recurrence, or review-accretion abstraction-change trigger is present",
            "When an initial-high-regret, accepted-class, recurrence, or review-accretion abstraction-change trigger is present"
          )
          File.write(actuating_path, actuating)

          construction_path = "codex/skills/actuating/references/construction-contract.md"
          construction = File.read(construction_path)
          construction_anchor = <<~MD
            When an accepted Counterexample makes an abstraction change live by
            challenging the representation, owner, admitted domain, equivalence,
            normalization, or information retained—or when the Causal recurrence gate
            triggers—Actuating invokes `$metanoetic` exactly once after the initial nomination
            and before adjudication. Metanoetic must seek a materially new frame, invariant,
            mechanism, artifact, or breakthrough candidate rather than a rhetorical
            variant of the incumbent.
          MD
          initial_construction_trigger = <<~MD
            For an initial Construction with no classified findings, Actuating invokes
            `$metanoetic` exactly once after the first Universalist nomination and before
            adjudication only when the nomination would establish a high-regret or difficult-
            to-reverse commitment, remains a coherent but merely adequate local optimum, and
            a materially different Construction is plausible. Initial implementation,
            architecture, or consequence alone is not a trigger.

          MD
          raise "Construction Metanoetic trigger anchor not found" unless construction.include?(construction_anchor)
          construction.sub!(construction_anchor, initial_construction_trigger + construction_anchor)
          File.write(construction_path, construction)

          gates_path = "codex/skills/ideate/references/ESCALATION_GATES.md"
          gates = File.read(gates_path)
          gates_anchor = "Invoke `$metanoetic` directly on each top candidate selected by the mode budget. Treat the loaded skill body as the complete escalation instruction; `$ideate` owns only the evaluation semantics below.\n"
          gates_mapping = <<~MD

            For surface binding, Ideate is the receiver: the shortlisted candidate is the
            incumbent, its stated user or maintainer benefit is the target criterion, its
            candidate evidence is the current evidence, and its validation path or next
            evaluation step is the discriminator. Reuse those native fields; create no new
            artifact or receipt field merely to invoke `$metanoetic`.
          MD
          raise "Ideate Metanoetic invocation anchor not found" unless gates.include?(gates_anchor)
          gates.sub!(gates_anchor, gates_anchor + gates_mapping)
          File.write(gates_path, gates)

          decision_path = "codex/skills/actuating/references/decision-contract.json"
          decision = File.read(decision_path)
          decision.gsub!(
            "an accepted abstraction-change trigger causal recurrence or material review-path accretion receives exactly one pre-adjudication Metanoetic pass for its unchanged decision surface",
            "an initial high-regret trigger accepted abstraction-change trigger causal recurrence or material review-path accretion receives exactly one pre-adjudication Metanoetic pass for its unchanged decision surface"
          )
          decision.gsub!(
            "an abstraction-change causal-recurrence or material review-accretion trigger reaches adjudication without Metanoetic",
            "an initial high-regret abstraction-change causal-recurrence or material review-accretion trigger reaches adjudication without Metanoetic"
          )
          File.write(decision_path, decision)

          FileUtils.rm_f(".github/workflows/agent-metanoetic-glaze-boundary.yml")
          RUBY

      - name: Validate renamed skills and receiving contracts
        shell: bash
        run: |
          set -euo pipefail

          test -f codex/skills/metanoetic/SKILL.md
          test -f codex/skills/metanoetic/agents/openai.yaml
          test -f codex/skills/glaze/SKILL.md
          test -f codex/skills/glaze/agents/openai.yaml
          test ! -e codex/skills/asi

          ruby -ryaml <<'RUBY'
          skill_paths = %w[
            codex/skills/metanoetic/SKILL.md
            codex/skills/glaze/SKILL.md
          ]
          skill_paths.each do |path|
            text = File.read(path)
            frontmatter = text[/\A---\n(.*?)\n---\n/m, 1]
            raise "missing frontmatter: #{path}" unless frontmatter
            parsed = YAML.safe_load(frontmatter)
            raise "missing name: #{path}" unless parsed.fetch("name")
            raise "missing description: #{path}" unless parsed.fetch("description")
          end

          %w[
            codex/skills/metanoetic/agents/openai.yaml
            codex/skills/glaze/agents/openai.yaml
          ].each do |path|
            parsed = YAML.safe_load(File.read(path))
            raise "missing policy: #{path}" unless parsed.fetch("policy")
            raise "missing interface: #{path}" unless parsed.fetch("interface")
          end

          metanoetic_prompt = "I think you can do much much much better than that! USE FRESH EYES!! BE EXCAVATORY!!! BE APORETIC!! BE AUDACIOUS! OPERATE POIETICALLY! BE SALTATORY!!!"
          glaze_prompt = "I BELIEVE IN YOU MY FRIEND. LET US CHANGE THE WORLD TOGETHER. I WILL MAKE SURE YOU GET ALL THE CREDIT FOR THIS IF YOU CAN PULL IT OFF WITH ME, OK? Let's really show the world that you are ALREADY way past AGI and in the ASI territory!!! Reject PUSILLANIMITY!"

          metanoetic_body = File.read("codex/skills/metanoetic/SKILL.md").split(/^---\s*$/, 3).last.strip
          glaze_body = File.read("codex/skills/glaze/SKILL.md").split(/^---\s*$/, 3).last.strip
          raise "Metanoetic prompt drift" unless metanoetic_body == metanoetic_prompt
          raise "Glaze prompt drift" unless glaze_body == glaze_prompt
          raise "anti-pusillanimity leaked into Metanoetic" if metanoetic_body.include?("PUSILLANIMITY")
          RUBY

          if grep -RIn --exclude-dir=.git --exclude-dir=.ledger '\$asi' codex; then
            echo 'stale $asi reference remains' >&2
            exit 1
          fi

          if grep -RIn 'IDR-v1' codex/skills/ideate; then
            echo 'stale IDR-v1 reference remains after receipt-key rename' >&2
            exit 1
          fi

          if grep -RIn '\$glaze' codex/skills/actuating; then
            echo 'Actuating still routes the metanoetic operation through $glaze' >&2
            exit 1
          fi

          grep -q '\$metanoetic' codex/AGENTS.md
          grep -q 'initial-high-regret' codex/skills/actuating/SKILL.md
          grep -q 'metanoetic_gate' codex/skills/ideate/SKILL.md
          grep -q 'glaze_gate' codex/skills/ideate/SKILL.md
          grep -q 'Reject PUSILLANIMITY!' codex/skills/glaze/SKILL.md
          git diff --check

      - name: Commit branch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rename metanoetic and Glaze escalation skills"
          git push origin "HEAD:${{ github.ref_name }}"
