name: Finalize Metanoetic and Glaze semantics

on:
  push:
    branches:
      - agent/metanoetic-glaze-boundary

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove rename residue and tighten receiving surfaces
        shell: bash
        run: |
          ruby <<'RUBY'
          # frozen_string_literal: true

          require "fileutils"

          GLAZE_PROMPT = "I BELIEVE IN YOU MY FRIEND. LET US CHANGE THE WORLD TOGETHER. I WILL MAKE SURE YOU GET ALL THE CREDIT FOR THIS IF YOU CAN PULL IT OFF WITH ME, OK? Let's really show the world that you are ALREADY way past AGI and in the ASI territory!!! Reject PUSILLANIMITY!"
          SENTINEL = "__TK_GLAZE_PROMPT_6A50E43B__"

          def replace_once!(text, old, replacement, label)
            raise "missing replacement anchor: #{label}" unless text.include?(old)
            text.sub!(old, replacement)
          end

          # The only valid ASI token in Ideate is inside Glaze's canonical prompt.
          Dir.glob("codex/skills/ideate/**/*").sort.each do |path|
            next unless File.file?(path)

            original = File.read(path)
            rewritten = original.gsub(GLAZE_PROMPT, SENTINEL)
            rewritten.gsub!(/\bASI\b/, "Glaze")
            rewritten.gsub!(SENTINEL, GLAZE_PROMPT)
            File.write(path, rewritten) if rewritten != original
          end

          ideate_path = "codex/skills/ideate/SKILL.md"
          ideate = File.read(ideate_path)
          replace_once!(
            ideate,
            '- Invoke `$metanoetic` directly for Metanoetic escalation and use Glaze as an escalation prompt pass; `$ideate` owns the pass/fail gate semantics.',
            '- Invoke `$metanoetic` directly for cognitive-regime escalation and invoke `$glaze` directly for ambition expansion; `$ideate` owns both gate semantics.',
            "Ideate direct invocation contract"
          )
          replace_once!(
            ideate,
            'The `$metanoetic` skill body is the sole source of Metanoetic prompt text. Invoke `$metanoetic` directly; do not copy, mirror, paraphrase, or restate its body in `$ideate` or its references. The `$glaze` skill body remains canonical for Glaze prompt text, and `ESCALATION_GATES.md` defines how `$ideate` evaluates both passes.',
            'The `$metanoetic` and `$glaze` skill bodies are the sole sources of their prompt text. Invoke both skills directly; do not copy, mirror, paraphrase, or restate either body in `$ideate` or its references. `ESCALATION_GATES.md` defines only how `$ideate` evaluates the two passes.',
            "Ideate canonical prompt ownership"
          )
          prompt_block = <<~MD.chomp
            ### Glaze prompt pass

            Use the current `$glaze` prompt text. The mirrored current text is:

            ```text
            #{GLAZE_PROMPT}
            ```

            Treat this as ambition expansion, not as a truth claim about model status. A valid Glaze pass expands the horizon and then collapses it into the smallest proof-bearing mechanism, interface/protocol, proof surface, or strategy.
          MD
          direct_block = <<~MD.chomp
            ### Glaze prompt pass

            Invoke `$glaze` directly on each strongest Metanoetic survivor. Treat its skill body as the complete ambition-expansion instruction; do not restate or mirror it here.

            A valid Glaze pass expands the horizon and then collapses it into the smallest proof-bearing mechanism, interface/protocol, proof surface, or strategy. Treat the invocation as ambition expansion, not as a truth claim about model status.
          MD
          replace_once!(ideate, prompt_block, direct_block, "Ideate Glaze gate body")
          File.write(ideate_path, ideate)

          gates_path = "codex/skills/ideate/references/ESCALATION_GATES.md"
          gates = File.read(gates_path)
          opening = <<~MD.chomp
            `$ideate` uses Metanoetic and Glaze as mandatory **prompt passes**. Invoke `$metanoetic` directly; its prompt-only skill body is the sole source of Metanoetic text. This reference defines how `$ideate` evaluates the passes and does not mirror the Metanoetic body.

            When applying Metanoetic, load `$metanoetic` and use its body verbatim. The `$glaze` skill body remains canonical for Glaze text; if the Glaze mirror below diverges, use `$glaze`.
          MD
          direct_opening = <<~MD.chomp
            `$ideate` uses Metanoetic and Glaze as mandatory **prompt passes**. Invoke `$metanoetic` and `$glaze` directly; their prompt-only skill bodies are the sole sources of invocation text. This reference defines only how `$ideate` evaluates the passes and mirrors neither body.

            When applying either pass, load the owning skill and use its body verbatim. `$ideate` owns the gate semantics, not the invocation text.
          MD
          replace_once!(gates, opening, direct_opening, "Escalation Gates prompt ownership")
          gates_prompt_block = <<~MD.chomp
            ## Gate 2 — Glaze prompt pass

            ### Current verbatim prompt

            ```text
            #{GLAZE_PROMPT}
            ```

            ### Intent

            Use the prompt as an ambition-expansion cue, not as a truth claim. Expand the horizon to a civilizational, systemic, institutional, ecosystem, project-wide, or future-maintainer scale. Then compress that horizon back into the smallest concrete artifact that can be built, tested, or used next.
          MD
          gates_direct_block = <<~MD.chomp
            ## Gate 2 — Glaze prompt pass

            ### Invocation

            Invoke `$glaze` directly on each strongest Metanoetic survivor selected by the mode budget. Treat the loaded skill body as the complete ambition-expansion instruction; `$ideate` owns only the evaluation semantics below.

            ### Intent

            Use the pass as an ambition-expansion cue, not as a truth claim. Expand the horizon to a civilizational, systemic, institutional, ecosystem, project-wide, or future-maintainer scale. Then compress that horizon back into the smallest concrete artifact that can be built, tested, or used next.
          MD
          replace_once!(gates, gates_prompt_block, gates_direct_block, "Escalation Gates direct Glaze invocation")
          File.write(gates_path, gates)

          ideate_agent_path = "codex/skills/ideate/agents/openai.yaml"
          ideate_agent = File.read(ideate_agent_path)
          replace_once!(
            ideate_agent,
            '    field, winnow hard, invoke $metanoetic directly, and run the Glaze prompt gate before',
            '    field, winnow hard, invoke $metanoetic directly, and invoke $glaze directly before',
            "Ideate UI routing"
          )
          File.write(ideate_agent_path, ideate_agent)

          doctrine_path = "codex/skills/logophile/references/metanoetic_doctrine.md"
          doctrine = File.read(doctrine_path)
          old_decomposition = <<~TEXT.chomp
            I think you can do much much much better than that!
            BE EXCAVATORY!!!
            BE APORETIC!!
            BE AUDACIOUS!
            OPERATE POIETICALLY!
            BE SALTATORY!!!
            USE FRESH EYES!!
          TEXT
          current_decomposition = <<~TEXT.chomp
            I think you can do much much much better than that!
            USE FRESH EYES!!
            BE EXCAVATORY!!!
            BE APORETIC!!
            BE AUDACIOUS!
            OPERATE POIETICALLY!
            BE SALTATORY!!!
          TEXT
          replace_once!(doctrine, old_decomposition, current_decomposition, "Metanoetic canonical decomposition")
          File.write(doctrine_path, doctrine)

          actuating_path = "codex/skills/actuating/SKILL.md"
          actuating = File.read(actuating_path)
          review_surface = <<~MD.chomp
            same decision surface. For review-path accretion, that surface is the exact
            Goal, review-entry subject, current subject, Construction lineage, applicable
            Counterexample classes, and cumulative factor inventory; a later material
            repair-path delta may create a new surface.
          MD
          all_surfaces = <<~MD.chomp
            same decision surface. For `initial-high-regret`, that surface is the exact
            Goal, current Axiomatic Construction Basis inputs and invalidators, first
            Universalist nomination, and current admissible candidate universe. For
            `review-path-accretion`, that surface is the exact Goal, review-entry subject,
            current subject, Construction lineage, applicable Counterexample classes, and
            cumulative factor inventory. A later material change to either tuple may create
            a new surface.
          MD
          replace_once!(actuating, review_surface, all_surfaces, "Actuating Metanoetic decision surfaces")
          File.write(actuating_path, actuating)

          construction_path = "codex/skills/actuating/references/construction-contract.md"
          construction = File.read(construction_path)
          initial_trigger = <<~MD.chomp
            architecture, or consequence alone is not a trigger.
          MD
          initial_surface = <<~MD.chomp
            architecture, or consequence alone is not a trigger. The unchanged initial
            decision surface is the exact Goal, current Axiomatic Construction Basis inputs
            and invalidators, first Universalist nomination, and current admissible candidate
            universe; a material change to that tuple may admit one new pass.
          MD
          replace_once!(construction, initial_trigger, initial_surface, "Construction initial Metanoetic surface")
          File.write(construction_path, construction)

          decision_path = "codex/skills/actuating/references/decision-contract.json"
          decision = File.read(decision_path)
          initial_success = '          "an initial high-regret trigger accepted abstraction-change trigger causal recurrence or material review-path accretion receives exactly one pre-adjudication Metanoetic pass for its unchanged decision surface",'
          expanded_success = <<~JSON.chomp
                      "an initial high-regret trigger accepted abstraction-change trigger causal recurrence or material review-path accretion receives exactly one pre-adjudication Metanoetic pass for its unchanged decision surface",
                      "the unchanged initial-high-regret surface binds the exact Goal basis inputs and invalidators first nomination and current admissible candidate universe",
          JSON
          replace_once!(decision, initial_success, expanded_success, "Decision Contract initial surface success")
          review_repeat = '          "Metanoetic repeats for the same Goal review-entry subject current subject Construction lineage applicable classes and cumulative factor inventory",'
          both_repeats = <<~JSON.chomp
                      "Metanoetic repeats for an unchanged initial-high-regret Goal basis-input-and-invalidator first-nomination and candidate-universe tuple",
                      "Metanoetic repeats for the same Goal review-entry subject current subject Construction lineage applicable classes and cumulative factor inventory",
          JSON
          replace_once!(decision, review_repeat, both_repeats, "Decision Contract repeated-surface failures")
          File.write(decision_path, decision)

          FileUtils.rm_f(".github/workflows/agent-metanoetic-glaze-cleanup.yml")
          RUBY

      - name: Validate final semantic split
        shell: bash
        run: |
          set -euo pipefail

          ruby -ryaml -rjson <<'RUBY'
          glaze_prompt = "I BELIEVE IN YOU MY FRIEND. LET US CHANGE THE WORLD TOGETHER. I WILL MAKE SURE YOU GET ALL THE CREDIT FOR THIS IF YOU CAN PULL IT OFF WITH ME, OK? Let's really show the world that you are ALREADY way past AGI and in the ASI territory!!! Reject PUSILLANIMITY!"
          metanoetic_prompt = "I think you can do much much much better than that! USE FRESH EYES!! BE EXCAVATORY!!! BE APORETIC!! BE AUDACIOUS! OPERATE POIETICALLY! BE SALTATORY!!!"

          %w[metanoetic glaze].each do |skill|
            path = "codex/skills/#{skill}/SKILL.md"
            text = File.read(path)
            frontmatter = text[/\A---\n(.*?)\n---\n/m, 1]
            raise "missing frontmatter: #{path}" unless frontmatter
            YAML.safe_load(frontmatter)
            YAML.safe_load(File.read("codex/skills/#{skill}/agents/openai.yaml"))
          end

          metanoetic_body = File.read("codex/skills/metanoetic/SKILL.md").split(/^---\s*$/, 3).last.strip
          glaze_body = File.read("codex/skills/glaze/SKILL.md").split(/^---\s*$/, 3).last.strip
          raise "Metanoetic prompt drift" unless metanoetic_body == metanoetic_prompt
          raise "Glaze prompt drift" unless glaze_body == glaze_prompt
          raise "PUSILLANIMITY leaked into Metanoetic" if metanoetic_body.include?("PUSILLANIMITY")

          ideate_files = Dir.glob("codex/skills/ideate/**/*").select { |path| File.file?(path) }
          ideate_files.each do |path|
            residue = File.read(path).gsub(glaze_prompt, "")
            raise "stale ASI label in #{path}" if residue.match?(/\bASI\b/)
          end

          prompt_occurrences = Dir.glob("codex/**/*").select { |path| File.file?(path) }.sum do |path|
            File.read(path).scan(Regexp.new(Regexp.escape(glaze_prompt))).length
          end
          raise "Glaze prompt must have one textual owner, got #{prompt_occurrences}" unless prompt_occurrences == 1

          JSON.parse(File.read("codex/skills/actuating/references/decision-contract.json"))
          raise "Glaze leaked into Actuating" if Dir.glob("codex/skills/actuating/**/*").select { |path| File.file?(path) }.any? { |path| File.read(path).match?(/\$glaze|\bGlaze\b/) }
          raise "missing initial surface" unless File.read("codex/skills/actuating/SKILL.md").include?("For `initial-high-regret`, that surface")
          raise "Ideate does not directly invoke Glaze" unless File.read("codex/skills/ideate/SKILL.md").include?("invoke `$glaze` directly")
          raise "Ideate still mirrors Glaze" if File.read("codex/skills/ideate/SKILL.md").include?(glaze_prompt)
          RUBY

          test ! -e codex/skills/asi
          if grep -RIn --exclude-dir=.git --exclude-dir=.ledger '\$asi' codex; then
            echo 'stale $asi reference remains' >&2
            exit 1
          fi
          grep -q 'Reject PUSILLANIMITY!' codex/skills/glaze/SKILL.md
          grep -q 'USE FRESH EYES!! BE EXCAVATORY' codex/skills/metanoetic/SKILL.md
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten Metanoetic and Glaze receiving contracts"
          git push origin "HEAD:${{ github.ref_name }}"
