name: Apply reviewed Ergon implementation
on:
  push:
    branches: [codex/ergon-ledger-prototype]
    paths:
      - .github/ergon-transfer/**
      - .github/workflows/ergon-apply.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/ergon-ledger-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checksum-verified reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ergon-transfer/{00,01,02,03,04,05,06,07,08} | base64 --decode | gzip -dc > "$RUNNER_TEMP/ergon.patch"
          printf '%s  %s\n' '927c8259d9e2ad4e366d93573f793a8d43fdde30284663b19dec3548aa4c06bb' "$RUNNER_TEMP/ergon.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/ergon.patch"
          git apply --index "$RUNNER_TEMP/ergon.patch"
          git rm -r .github/ergon-transfer .github/workflows/ergon-apply.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ergon): implement dependency-aware work tracking and complete native acceptance'
          git push origin HEAD:refs/heads/codex/ergon-ledger-prototype
