policy:
  allow_implicit_invocation: true
interface:
  display_name: "seq"
  short_description: "Observe session facts with provenance and limits"
  default_prompt: "Use $seq with the narrowest native physical command or owning passive observation definition from the selected skill package. Require Seq 1.x, seq-observation-abi/v1, and seq-observation-result/v2; preserve scope, corpus identity, provenance, contamination, limitations, and uncertainty; never treat an observation as semantic authority."
