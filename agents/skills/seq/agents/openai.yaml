policy:
  allow_implicit_invocation: true
interface:
  display_name: "seq"
  short_description: "Observe session facts with provenance and limits"
  default_prompt: "Use $seq with the narrowest native physical command or owning passive observation definition. Require Seq 1.x and seq-observation-abi/v1; preserve denominators, corpus identity, provenance, contamination, limitations, and uncertainty; never treat an observation as semantic authority."
