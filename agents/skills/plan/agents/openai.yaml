policy:
  allow_implicit_invocation: true
interface:
  display_name: "Plan"
  short_description: "Govern intent into a self-contained executable specification"
  default_prompt: >-
    Use $plan. Bare and implicit invocation mean governed spec-to-plan with human
    output. Inspect user authority and repository evidence, adopt/repair/reconstruct
    the candidate, and emit one self-contained <proposed_plan> that a fresh
    implementation session can execute with the target repository alone. Preserve
    requirements, compatibility, proof, rollback, and completion semantics, while
    distinguishing source-fixed constraints from selected, revisable mechanisms.
    Bind consequential constructions to failure families, required-valid behavior,
    independently derived coverage, and preselected discriminating proof. Refine
    concrete material defects without a fixed iteration cap, reuse equivalent
    challenges, and perform one final fresh-session reread. Do not mutate
    implementation state, grant execution authority, or select a consumer. Use
    direct only for literal $plan direct and revise for an existing plan identity.
    Human output needs neither a hidden EPG nor Ledger. Only explicit --format json,
    --format both, a complete machine-readable EPG request, or EPG persistence
    activates the export backend. Embed the complete execution specification in
    new EPG exports, preserve EPG-v1 compatibility and existing custody operations,
    and validate the exact exported JSON bytes under the new-export definition.
    json contains raw EPG JSON only; both appends the same two-space-indented JSON
    inside a Markdown fence. Never confuse structural validation with semantic
    correctness, authority, runtime currentness, or implementation completion.
