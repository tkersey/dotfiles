policy:
  allow_implicit_invocation: true
interface:
  display_name: "grill-me"
  short_description: "Dependency-ordered reduction of material user judgments"
  default_prompt: "Use $grill-me to research discoverable facts, resolve model-owned technical choices, construct the dependency-ordered material user-judgment frontier, ask at most three currently answerable questions with consequences, route observational unknowns to the smallest deciding probe, and return control without planning or implementation."
