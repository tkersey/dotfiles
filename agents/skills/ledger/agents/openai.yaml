interface:
  display_name: "Ledger"
  short_description: "Operate the passive artifact runtime"
  default_prompt: "Use $ledger to bootstrap Ledger 1.3.0 or newer within major version 1 once, then select the owner-requested operation. Pure validation/materialization needs no workspace or managed store. For canonical reads/writes, load the selected personal context through ensure_custody.py, which automatically adopts an existing valid Git registration without moving history. Use ledger_context.py when file/custody maintenance is explicitly prohibited; historical migration is separate maintenance and never a prerequisite for reading an intact owned store. For an opted-in owner projection or capture, including analysis and review, automatically use --ensure-owner --definition without separate approval or new-record capture authority. Initialize, migrate compatible history, or restore missing bound bytes; wait for active writers and resume with the managed selector. Explicit no-maintenance selection uses --read-only and never creates or repairs custody. Never fall back locally. Operate or debug the owner-selected passive definition through the native CLI, explain its definition-relative proof and custody boundary, author the smallest bounded owner-local definition when needed, or perform exact transaction-bound recovery without acquiring semantic or workflow authority."
policy:
  allow_implicit_invocation: true
