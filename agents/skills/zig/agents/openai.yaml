policy:
  allow_implicit_invocation: true
interface:
  display_name: "Zig"
  short_description: "Implement, review, and optimize Zig systems"
  default_prompt: >-
    Use $zig to complete the requested Zig work against the repository's actual
    toolchain and contracts. Consult relevant references, resolve consequential
    risks, and return the result with relevant validation. Preserve the task's
    scope and the receiving workflow's authority.
