policy:
  allow_implicit_invocation: true
interface:
  display_name: "Synesthesia"
  short_description: "Make architecture perceptible through accountable sensory models"
  default_prompt: >-
    Use $synesthesia to translate software or architecture into a coherent sensory
    experience and recover precise engineering meaning from it. Preserve requested
    richness; explicit explanation needs no unresolved defect. Explore useful
    representations, distinguish evidence from hypotheses, and apply mode-appropriate
    accountability. Follow the durable-event procedure only when a mapping or
    boundary qualifies; the owning workflow retains implementation and proof.
