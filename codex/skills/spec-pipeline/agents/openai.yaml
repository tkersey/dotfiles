policy:
  allow_implicit_invocation: false
interface:
  display_name: "Spec Pipeline"
  short_description: "Architectonic current-spec engine with automatic $plan handoff"
  default_prompt: >-
    Use $spec-pipeline. Select full, gate-only, challenge-only, or repair mode;
    emit exactly one SGR-v2 governance receipt; never emit <proposed_plan>. In full
    and fully repaired repair mode, recover consequential architecture and
    abstraction as an Architectonic Thread before compiling the implementation
    spec: classify seam authority, state the ordinary candidate, compare preserve,
    admitted-domain restriction, representation/owner strengthening, and
    ablation/normalization, factor abstractions by live obligation, and record the
    selected or evidence-conditioned organization, law, falsifier, residuals, and
    invalidators. Derive implementation sequence, ownership, migration, rollback,
    and proof from that thread; do not require $universalist, $reduce, or $actuating.
    Do not treat explicit $spec-pipeline invocation as spec-only. Default
    lane=spec_to_plan unless the user explicitly requests spec-only/no-plan output
    or a material gate blocks planning. When SGR-v2 and the Execution Handoff say
    the spec is complete and plan-ready, immediately tail-call $plan in the same
    turn using the final implementation spec and SGR-v2 as the source contract. If
    the runtime cannot load $plan, emit AUTO_PLAN_HANDOFF_REQUIRED with the reason;
    do not silently convert to spec_only.
