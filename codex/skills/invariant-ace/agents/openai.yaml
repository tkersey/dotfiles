policy:
  allow_implicit_invocation: true
interface:
  display_name: "Invariant Ace"
  short_description: "Check invariants, owners, transitions, and proof"
  default_prompt: "Use $invariant-ace to assess all seven substantive questions directly for bounded single-owner work. Require independent review only for dimensions with concrete unresolved owner, transition, enforcement, witness, proof, or countercase conflicts, or when the caller expressly requires it. Preserve the same Invariant Gate, every required clearance, and unresolved veto. A full report changes presentation, not the fanout threshold; Actuating's evidence-only composition still takes precedence."
