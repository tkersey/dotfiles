policy:
  allow_implicit_invocation: true
interface:
  display_name: "Invariant Ace"
  short_description: "Check invariants, owners, transitions, and proof"
  default_prompt: "Use $invariant-ace to establish source-backed ownership, transition and bypass coverage before directly assessing all seven questions. Require only the implicated independent challenge when material premises remain unestablished or conflicted, even without a recognized contradiction; reuse qualifying independent packets. Do not relabel root evidence as independent or invent missing source. Preserve the same Invariant Gate, required clearances, and unresolved vetoes. Report length does not select fanout; Actuating's evidence-only composition takes precedence."
