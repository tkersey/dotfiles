policy:
  allow_implicit_invocation: false
interface:
  display_name: "Tune"
  short_description: "Tune skills from decision provenance"
  default_prompt: "Use $tune with its passive Seq evidence definition and Ledger artifact definitions to compare a target skill's decision contract with observed episodes and outcomes, then produce one bounded skill delta or terminal state. Treat commit and push as publishing steps that require explicit user intent."
