interface:
  display_name: "Universalist"
  short_description: "Derive simpler constructions with algebra"
  brand_color: "#6D5EF6"
  default_prompt: "Use $universalist to formulate and derive solutions to task-relevant semantic questions using algebraic and categorical knowledge. Do not wait for duplication, a named boundary defect, a failed ordinary candidate, or a preidentified typed hole. Derive candidate laws, operations, carriers, observations, and discriminators from required behavior and concrete evidence; theories may suggest hypotheses but cannot certify them. Compare native realizations and retain only supported claims. Reuse adequate derivations and skip purely mechanical work. In Actuating or Architectonic, nominate within the existing inquiry without selecting, executing, or creating standalone durability."
policy:
  allow_implicit_invocation: true
