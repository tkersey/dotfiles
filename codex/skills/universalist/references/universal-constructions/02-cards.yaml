- id: safe_graph_rewrite
  expert_name: Pushout complement / double pushout
  public_name: validated delete-preserve-add rewrite
  route: UNI-CANONICAL
  moves:
  - glue
  - obstruct
  signals:
  - delete-preserve-add-rewrite
  - graph-rewrite
  requires:
  - preserved_interface
  - match_is_typed
  emits:
  - rewrite-rule-and-trace
  laws:
  - preserved interface remains unchanged
  - deletions and additions are exact
  falsifiers:
  - dangling reference
  - forbidden identification
  fallback: transactional rewrite with explicit checks
  universal:
    role: emitter
    competitors: every admissible consumer or interpretation of the generated/integrated artifact
    mediator: one comparison path from the selected artifact into each compatible consumer
    canonicality: the comparison is unique up to the declared observations, equations, and normalization
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
