- id: static_program_plan
  expert_name: Free applicative
  public_name: statically inspectable program plan
  route: UNI-CANONICAL
  moves:
  - generate
  - compose
  signals:
  - static-computation-shape
  - multiple-static-interpreters
  - component-local-description-with-global-phases
  requires:
  - shape_known_before_results
  emits:
  - static-plan-ir
  laws:
  - analysis and execution agree on declared structure
  - unit and static combination laws hold
  falsifiers:
  - a later operation depends on an earlier value
  - static structure is used to infer effect commutativity
  - phase composition changes required within-phase order or runs later effects after an unhandled earlier failure
  fallback: explicit list or tree of operations
  universal:
    role: composition
    competitors: for a free-applicative claim, applicatives with a natural interpretation of the generators
    mediator: the induced applicative interpretation of the generated plan
    canonicality: uniqueness follows from generator interpretation and applicative laws, not from one runner
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
  selection_mode: selectable
  diagnostic_order: 21
