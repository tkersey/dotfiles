  - canonical-boundary-artifacts.md
- id: observation_vocabulary
  expert_name: Observation vocabulary / Yoneda only with natural representability evidence
  public_name: first-class observation vocabulary
  route: UNI-CANONICAL
  moves:
  - observe
  signals:
  - projection-sprawl
  - duplicated-observations
  requires:
  - sanctioned_observations
  emits:
  - observation-ir-and-runner
  laws:
  - representation changes preserve every sanctioned observation
  - quotienting requires adequacy under permitted future operations, not just current projections
  falsifiers:
  - an allowed observation or continuation distinguishes values that were collapsed
  - a finite probe list is called a Yoneda representation without the natural correspondence
  fallback: central projection service
  universal:
    role: observation
    competitors: only for a Yoneda claim, natural transformations from the specified representable functor
    mediator: evaluation at identity and its natural inverse, not the observation runner alone
    canonicality: the natural correspondence must be established; finite application probes do not supply it
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
  selection_mode: selectable
