- id: value_dependent_program
  expert_name: Monad / endofunctor composition
  public_name: value-dependent program sequence
  route: UNI-ORDINARY
  moves:
  - compose
  signals:
  - value-dependent-sequencing
  requires:
  - later_shape_depends_on_result
  emits:
  - bindable-program-ir
  laws:
  - left identity, right identity, and associativity hold under the declared observations
  - bind preserves interpreter semantics and required effect ordering
  falsifiers:
  - a later operation is chosen before the required value exists
  fallback: ordinary sequential function
  universal:
    role: composition
    competitors: not required for monad laws; a separate free-construction claim names its models
    mediator: not required for a lawful sequence; a free-construction claim must derive its interpreter
    canonicality: monad laws do not imply freeness or a unique implementation
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
  selection_mode: selectable
  diagnostic_order: 20
