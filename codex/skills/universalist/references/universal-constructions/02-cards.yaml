- id: coherent_state_machine
  expert_name: Behavioral coalgebra
  public_name: observable transition system
  route: UNI-ORDINARY
  moves:
  - observe
  - compose
  signals:
  - ongoing-behavior
  - state-machine-drift
  requires:
  - transition_and_observation
  emits:
  - step-and-observe
  laws:
  - expected traces are reproduced
  - claimed-equivalent states remain equivalent under every permitted continuation
  - required outputs, effects, failures, and temporal observations are retained
  falsifiers:
  - invalid transition is accepted
  - states with the same current display have distinguishable required future traces
  - a valid transition or required recovery behavior is excluded
  fallback: explicit state machine
  universal:
    role: observation
    competitors: only for a final-coalgebra claim, coalgebras of a specified functor
    mediator: only for that stronger claim, a coalgebra morphism into the proposed final carrier
    canonicality: finality requires a unique such morphism; an ordinary state machine does not
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
  selection_mode: selectable
  diagnostic_order: 22
  hole_kinds:
