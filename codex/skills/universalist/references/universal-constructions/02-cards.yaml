  emits:
  - strategy-or-function
  laws:
  - evaluation agrees with prior branch fixtures
  falsifiers:
  - strategy changes an undeclared observation
  fallback: named strategy interface
  universal:
    role: composition
    competitors: only for an exponential claim, maps X times A to B in the declared world
    mediator: currying with an evaluation map; not supplied by a strategy interface alone
    canonicality: beta and eta equations are required only when exponential structure is claimed
    effectivity: construction, comparison, interpretation, and validation fit the declared resource model
