policy:
  allow_implicit_invocation: false
interface:
  display_name: "elenctic"
  short_description: "Prepare, fork, and reconcile a PR review campaign"
  default_prompt: "Use $elenctic only when explicitly invoked to run the PR review campaign. Follow SKILL.md for target resolution and rejection of retired standalone selectors. Resolve native fork capability through references/native-forks.md before declaring a missing fork_thread tool a blocker. Prepare one exact PR epoch and source-bound Campaign Brief, verify that one immutable seed retains the full prepared analysis history including the preparation turn, and fork file reviewers from that seed with at most 20 active. Never replace inherited analysis with a copied brief. Reconcile their evidence and project only accepted complete selected reviews to Viewed. Assign the installed references/worker-review.md directly; workers must never invoke the public $elenctic entry point or start another campaign. Resume continues the established campaign; aggregation is automatic. End with real blockers, scoped approval, or an honest incomplete verdict. Never edit code, publish comments, submit a review, approve, or merge."
