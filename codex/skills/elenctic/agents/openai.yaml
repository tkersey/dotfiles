policy:
  allow_implicit_invocation: false
interface:
  display_name: "elenctic"
  short_description: "Reconcile prior threads, then review the PR"
  default_prompt: "Use $elenctic only when explicitly invoked to run the PR review campaign. Follow SKILL.md for target resolution and rejection of retired standalone selectors. After exact-epoch binding, first follow references/prior-review-threads.md: inspect unresolved threads initiated by the authenticated gh user, critically verify replies and relevant code changes, resolve only justified own-root threads when authorized, and report outcomes. Run this preflight on resume and with all files Viewed; no eligible threads proceeds directly to review. Honor read-only limits; workers never mutate threads. Resolve native fork capability through references/native-forks.md before declaring a missing fork_thread tool a blocker. Prepare one exact PR epoch and source-bound Campaign Brief, verify that one immutable seed retains the full prepared analysis history including the preparation turn, and fork file reviewers from that seed with at most 20 active. Never replace inherited analysis with a copied brief. Reconcile their evidence with surviving prior-thread concerns; link existing open threads instead of duplicate comment drafts. Project only accepted complete selected file reviews to Viewed; thread adjudication grants no file coverage. Assign the installed references/worker-review.md directly; workers must never invoke the public $elenctic entry point or start another campaign. Resume continues the established campaign; aggregation is automatic. End with real blockers, scoped approval, or an honest incomplete verdict. Never edit code, publish comments or replies, submit a review, approve, merge, resolve other reviewers' threads, or reopen resolved threads."
