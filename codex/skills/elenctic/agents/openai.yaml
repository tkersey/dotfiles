policy:
  allow_implicit_invocation: false
interface:
  display_name: "elenctic"
  short_description: "Prepare, fork, and aggregate a PR review campaign"
  default_prompt: "Use $elenctic only when explicitly invoked. Bare invocation, bare `campaign`, and `this PR`/`this branch` default to campaign mode and resolve the open PR for the current branch; an explicit PR number, URL, or named branch is passed to `gh pr view` as the requested selector. An explicit file target stays in file mode even when it also names a PR, branch, or range unless `campaign` or `aggregate` is explicit. Aggregate-only commands never create task or Viewed authority, even with a PR selector. For an authorized campaign, check native seed-fork and provenance capabilities before deep preparation, bind one exact PR epoch, analyze the complete change in the primary thread, publish a source-bound Campaign Brief, freeze that context in one immutable seed, fork every file-mode reviewer from the seed with a sliding concurrency ceiling of 20, admit reports and reconcile complementary evidence by obligation, attempt epoch-checked best-effort Viewed projection only for accepted complete selected reviews, and end with retained real blockers, scoped approval, or an honest incomplete verdict. Revalidate relied-on premises from the entire inherited history; the brief is orientation, not proof. Preserve applicable user authority. File counts and worker dispositions do not substitute for semantic reconciliation. Use `$elenctic file <path>` for one-file causal review; keep path-only invocation as a compatibility shorthand. Session-corpus remains the $seq-backed same-name aggregation mode."
