policy:
  allow_implicit_invocation: false
interface:
  display_name: "elenctic"
  short_description: "Prepare, fork, and aggregate a PR review campaign"
  default_prompt: "Use $elenctic only when explicitly invoked. Bare invocation, bare `campaign`, and `this PR`/`this branch` default to campaign mode and resolve the open PR for the current branch; an explicit PR number, URL, or named branch is passed to `gh pr view` as the requested selector. An explicit file target stays in file mode even when it also names a PR, branch, or range unless `campaign` or `aggregate` is explicit. Bind one exact PR epoch, deeply analyze the complete change in the primary thread, publish a source-bound Campaign Brief, freeze that context in one immutable seed, fork every file-mode reviewer from the seed with a sliding concurrency ceiling of 20, admit and causally aggregate their reports, mark only accepted complete current-head files Viewed, and end with retained real blockers, scoped approval, or an honest incomplete verdict. Treat inherited context as orientation rather than authority. Use `$elenctic file <path>` for one-file causal review; keep path-only invocation as a compatibility shorthand. Session-corpus remains the $seq-backed same-name aggregation mode."
