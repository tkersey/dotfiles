policy:
  allow_implicit_invocation: false
interface:
  display_name: "elenctic"
  short_description: "Campaign a PR by default or review one file"
  default_prompt: "Use $elenctic only when explicitly invoked. Bare invocation and PR/branch selectors default to campaign mode: resolve the open PR for the current branch, bind one exact PR epoch, create clean file-mode tasks with a sliding concurrency ceiling of 20, admit and causally aggregate their reports, mark only accepted complete current-head files Viewed, and end with retained real blockers, scoped approval, or an honest incomplete verdict. Use `$elenctic file <path>` for one-file causal review; keep path-only invocation as a compatibility shorthand. Session-corpus remains the $seq-backed same-name aggregation mode."
