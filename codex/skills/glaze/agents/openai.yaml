policy:
  allow_implicit_invocation: true
interface:
  display_name: "glaze"
  short_description: "Challenge a frozen incumbent with one bounded reframe"
  default_prompt: "Use $glaze once: first bind the incumbent, owning workflow, target observation or acceptance criterion, evidence, and falsifier; if an explicit invocation lacks any binding, return `blocked` and name what is missing, otherwise preserve the canonical one-line escalation, return `material-reframe` or `no-material-reframe`, and leave selection, mutation, and closure to the owning workflow."
