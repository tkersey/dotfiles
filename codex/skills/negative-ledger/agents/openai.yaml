policy:
  allow_implicit_invocation: true
interface:
  display_name: "Negative Ledger"
  short_description: "Recall and prune witnessed failed routes and regressions"
  default_prompt: "Use $negative-ledger implicitly when implementation, debugging, review, or validation encounters a witnessed failed or no-effect route, benchmark or test regression, revert, repeated same-cluster retry, abandoned strategy, or a question about what has already been tried. Project the exact current route-gate before repeating a route, and treat transient failures and first incomplete attempts as no-op. Retain exactly one source-owned disposition without sibling coordination. Capture only durable decision-shaping evidence; admit a complete native projection only after the source admission gate passes."
