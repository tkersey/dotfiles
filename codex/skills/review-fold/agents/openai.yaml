policy:
  allow_implicit_invocation: true
interface:
  display_name: "Review Fold"
  short_description: "Classify evidence and preserve admitted counterexamples"
  default_prompt: "Use $review-fold to project the Review Fold counterexample basis, preserve every witness's original subject, classify current applicability, and decide whether each proposed law is entailed by the accepted Goal, a strengthening, preference, new requirement, or underdetermined. Capture only independent, current, entailed, accepted witnesses through review-fold/counterexample-corpus; persist source facts and semantic admission, never current applicability, class, family, owner, cut, carrier, route, review credit, or closure. Quotient observational same-law classes, distinguish predictions from later discoveries, default recurrence to unknown when history is incomplete, and report exact relation to any eliminated claim. Never select a repair or architecture, grant mutation, broaden the Goal, or treat the corpus as current truth."
