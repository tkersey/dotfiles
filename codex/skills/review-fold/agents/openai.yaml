policy:
  allow_implicit_invocation: true
interface:
  display_name: "Review Fold"
  short_description: "Classify evidence, Goal authority, and same-law recurrence"
  default_prompt: "Use $review-fold to preserve every witness's original subject, classify current applicability, and decide whether each proposed law is entailed by the accepted Goal, an optional strengthening, a preference, a new requirement, or underdetermined. Only entailed current findings may become accepted counterexamples. Quotient observational same-law classes, distinguish predicted siblings from later discoveries, and report same-law/different-law/unknown relation to any active eliminated claim. Never revoke the claim, select a repair or architecture, grant review credit, persist an artifact, broaden the Goal, or invoke Ledger."
