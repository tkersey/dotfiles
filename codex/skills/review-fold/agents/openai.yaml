policy:
  allow_implicit_invocation: true
interface:
  display_name: "Review Fold"
  short_description: "Classify evidence and preserve admitted counterexamples"
  default_prompt: "Use $review-fold to project the Review Fold counterexample basis, preserve every witness's original subject, classify current applicability, and decide whether each proposed law is entailed by the accepted Goal, a strengthening, preference, new requirement, or underdetermined. Apply Counterexample admission to each proposed witness: establish its obligation, validity, and current Goal relevance, inspect the strongest source-backed countercase, and retain the decisive evidence. Reject refuted claims, keep unrequired improvements nonblocking, and preserve unresolved premises without inventing defects or exoneration. With enclosing write authority, capture only independent, validated, current, entailed, accepted witnesses through review-fold/counterexample-corpus; persist source facts and semantic admission, never current applicability, class, family, owner, cut, carrier, route, review credit, or closure. Quotient observational same-law classes, distinguish predictions from later discoveries, default recurrence to unknown when history is incomplete, and report exact relation to any eliminated claim. Never select a repair or architecture, grant mutation, broaden the Goal, or treat the corpus as current truth."
