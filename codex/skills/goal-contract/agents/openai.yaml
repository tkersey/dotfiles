policy:
  allow_implicit_invocation: true
interface:
  display_name: "Goal Contract"
  short_description: "Compile accepted truth and authority"
  default_prompt: "Use $goal-contract to compile the current accepted source into an exact in-context Goal Contract covering outcomes, non-goals, authority, immutable base and path scope, compatibility, laws, required observations, validation, publication, and review posture. Do not select architecture, grant mutation, persist workflow state, or invoke Ledger."
