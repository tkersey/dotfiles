policy:
  allow_implicit_invocation: false
interface:
  display_name: "Plan"
  short_description: "Synthesize proportional architectonic plans"
  default_prompt: >-
    Use $plan to synthesize accepted intent into one canonical, source-bound,
    architecture-aware EPG-v1 plan. Refine source-owned architecture, only the
    architectonic change delegated to Plan, and execution policy until material
    improvements are exhausted; run fresh eyes and one private radical candidate.
    Emit no Plan-owned runtime state, decision, transition, readiness, or execution
    handoff artifact. Do not invent an architectonic seam for work inside an
    unchanged exact boundary. Validate the exact emitted EPG through
    codex/skills/plan/definitions/ledger/execution-policy-graph.json, or persist it
    through the importing plan-policy-document definition, and report only that it
    is structurally valid under the returned definition digest.
    Never grant mutation authority, select an execution owner, require $actuating,
    $universalist, or $reduce, or silently infer an existing plan.
