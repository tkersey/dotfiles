policy:
  allow_implicit_invocation: true
interface:
  display_name: "Plan"
  short_description: "Govern candidate specs and synthesize implementation plans"
  default_prompt: >-
    Use $plan. Bare invocation and implicit planning requests mean spec-to-plan:
    treat any supplied specification as a candidate, inspect authoritative source
    and repository evidence, adopt/repair/reconstruct it, run the strongest
    invariant challenge and specification fresh-eyes pass, then synthesize one
    source-bound architecture-aware EPG-v1. Use direct mode only for explicit
    `$plan direct`; use revise for an existing plan_id. Specification completion
    continues into planning unless the user explicitly requests specification-only
    output. Reopen the affected specification phase internally when policy
    synthesis exposes a source-fixed contradiction; never emit an SGR, PSC,
    next-owner, tail-call, readiness, or execution-handoff artifact. Refine
    architecture and policy to a fixed point, run one private radical candidate,
    validate the exact EPG through Plan's passive Ledger definition, and never
    mutate implementation state, grant execution authority, or select a consumer.
    Default to `--format human`: emit a self-contained, dependency-ordered execution
    plan without inline EPG JSON. Given the target repository, a fresh implementation
    session must be able to realize and prove the plan from the `<proposed_plan>`
    block alone, without the original candidate, prior conversation, private
    synthesis, or omitted EPG. Preserve every implementation-relevant semantic;
    block on material unresolved judgment unless an exact observation-conditioned
    branch resolves it. Emit the full EPG only for explicit `--format json|both`
    or an unambiguous natural-language request for the complete machine-readable
    EPG. For `json`, emit only raw EPG JSON with no status prose or Markdown fence;
    for `both`, validate the JSON payload bytes inside the fence. Always use
    two-space indentation and validate the exact EPG bytes emitted.
