skill_decision_contract:
  contract_version: SKDC-v1
  skill:
    name: plan
    kind: mixed
    source_fingerprint: plan-v5-compiled-architectonic-epg
  triggers:
    - trigger_id: PLAN-COMPILE
      description: Accepted intent needs a named execution policy.
      cue_literals: [$plan, ready_for_plan, execution policy]
      cue_regexes: []
      exclusions: []
    - trigger_id: PLAN-RELATION
      description: A dependency on another plan is discovered.
      cue_literals: [cross-plan dependency, another plan]
      cue_regexes: []
      exclusions: []
    - trigger_id: PLAN-SYNTHESIS
      description: The architecture-policy candidate must be refined to a fixed point.
      cue_literals: [iterate, improve the plan, exhaustive refinement, creativity pass]
      cue_regexes: []
      exclusions: []
    - trigger_id: PLAN-ARCHITECTONIC
      description: Plan actions depend on a consequential architecture, representation, owner, composition law, or abstraction factorization.
      cue_literals: [architecture, abstraction, representation, owner, rearchitecture, migration, normalize, ablate]
      cue_regexes: []
      exclusions: []
  routes:
    - route_id: PLAN-EMIT
      description: Emit one named architecture-aware EPG that passes compilation.
      aliases: [emit]
      terminal: "yes"
    - route_id: PLAN-REFINE
      description: Continue internal synthesis because a material architecture-policy improvement remains.
      aliases: [refine]
      terminal: "no"
    - route_id: PLAN-RETURN-SPEC
      description: Return a source-fixed semantic or architectonic contradiction.
      aliases: [return-to-spec]
      terminal: "yes"
    - route_id: PLAN-RETURN-GRILL
      description: Return an unresolved user judgment.
      aliases: [return-to-grill]
      terminal: "yes"
    - route_id: PLAN-BLOCK
      description: Block because identity, authority, convergence, architecture, or evidence is unavailable.
      aliases: [blocked]
      terminal: "yes"
  clauses:
    - clause_id: PLAN-ID-001
      trigger_refs: [PLAN-COMPILE]
      expected_routes: [PLAN-EMIT, PLAN-REFINE, PLAN-RETURN-SPEC, PLAN-RETURN-GRILL, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [EPG-v1 with immutable plan_id, source digest, target branch]
      success_signals: [opaque policy compilation succeeds]
      failure_signals: [plan inferred from current execution state]
      rationale: Plan identity is the unit of namespace isolation.
    - clause_id: PLAN-CROSS-001
      trigger_refs: [PLAN-RELATION]
      expected_routes: [PLAN-EMIT, PLAN-REFINE, PLAN-RETURN-SPEC, PLAN-RETURN-GRILL, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [EPG-v1]
      success_signals: [edge remains a proposal until accepted by a downstream controller]
      failure_signals: [foreign work copied into current plan]
      rationale: Cross-plan authority belongs to the consuming workspace or controller.
    - clause_id: PLAN-ARCHITECTONIC-001
      trigger_refs: [PLAN-COMPILE, PLAN-ARCHITECTONIC]
      expected_routes: [PLAN-EMIT, PLAN-REFINE, PLAN-RETURN-SPEC, PLAN-RETURN-GRILL, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [architectonic seams, authority classes, factor obligations, action bindings]
      success_signals: [all seams dispositioned, no dominated retained factor, no action realizes a retired factor]
      failure_signals: [architecture only in prose, file-shaped factors, reconstructed truth]
      rationale: Architecture and abstraction are state over which policy synthesis converges, not a detached review section.
    - clause_id: PLAN-TRANSPORT-001
      trigger_refs: [PLAN-SYNTHESIS, PLAN-ARCHITECTONIC]
      expected_routes: [PLAN-REFINE, PLAN-EMIT, PLAN-RETURN-SPEC, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [architectonic change relation, action partition, square results and falsifiers]
      success_signals: [changed architecture transports policy, claimed interchange preserves observations]
      failure_signals: [stale actions survive retired factors, incoherent rollback, unevidenced double-category claim]
      rationale: Plan revisions must remain coherent across architecture and policy change.
    - clause_id: PLAN-SYNTHESIS-001
      trigger_refs: [PLAN-COMPILE, PLAN-SYNTHESIS]
      expected_routes: [PLAN-REFINE, PLAN-EMIT, PLAN-RETURN-SPEC, PLAN-RETURN-GRILL, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [EPG-v1]
      success_signals: [canonical digest binds complete EPG, opaque compilation succeeds, stronger proof may delete surface]
      failure_signals: [uncompiled EPG emitted, policy converged only inside an unquestioned inherited decomposition]
      rationale: Planning quality depends on exhaustive joint refinement, not just schema presence.
    - clause_id: PLAN-CREATIVITY-001
      trigger_refs: [PLAN-SYNTHESIS]
      expected_routes: [PLAN-REFINE, PLAN-EMIT, PLAN-RETURN-SPEC, PLAN-BLOCK]
      prohibited_routes: []
      required_artifacts: [radical candidate disposition]
      success_signals: [candidate may improve organization, admitted domain, representation, ownership, factorization, evidence, or policy and is adopted/rejected/deferred/routed with evidence]
      failure_signals: [arbitrary architectural addition after convergence, no radical candidate attempted, architecture change returned upstream despite remaining inside plan authority]
      rationale: Creativity is mandatory; architectural or policy accretion is optional.
  instrumentation:
    decision_receipt: not-needed
    rationale: The canonical EPG and compiler result are the complete Plan evidence surface.
