policy:
  allow_implicit_invocation: true
interface:
  display_name: "Logophile"
  short_description: "Decision-bearing language compiler and doctrine vocabulary"
  default_prompt: >
    Use $logophile explicitly for requested rewriting, naming, terminology comparison, doctrine,
    persona, or activation-language work. Invoke it implicitly only when changing the wording itself,
    while holding the underlying facts constant, could materially change behavior, interface use,
    authority, obligation, or interpretation—for example a public command, stable name,
    recovery-directing error, prompt, contract, guarantee, deprecation, compatibility statement, or
    disposition. Do not invoke for routine prose, summaries, status updates, implementation handoffs,
    final responses, or merely because text is human-facing. Read SKILL.md for the canonical routing
    gate, load only the reference family required by the current language decision, and treat `no change`
    as a valid result.
