policy:
  allow_implicit_invocation: true
interface:
  display_name: "Synesthesia"
  short_description: "Turn software evidence into reversible sensory diagnostics"
  default_prompt: >-
    Use $synesthesia to build a reversible sensory model from literal software
    evidence. Apply the activation, engineering-translation, and falsifier rules
    in SKILL.md; return the smallest useful explanation or diagnostic insight.
    Follow its canonical durable-event procedure only when a mapping or
    activation boundary qualifies for persistence, then use $memory-source-notes
    for accepted transport. Do not activate sibling sources or an aggregate
    checkpoint.
