policy:
  allow_implicit_invocation: false
interface:
  display_name: "Codebase Doctrine"
  short_description: "Recover a repository's latent constitution for future decisions"
  default_prompt: >-
    Use $codebase-doctrine read-only to recover the repository's latent
    constitution, not to fill schemas. Establish the consumer and change horizon,
    trace change-bearing seams, form rival explanations, recover selection
    pressures, map jurisdictions and authorities, derive laws together with
    permitted variation, excavate wounds and rejected routes, map proof as claim
    coverage, and preserve real contradiction as governed aporia. Compress the
    result to the smallest doctrine whose absence could cause a plausible wrong
    decision, then render exact Markdown context for the requested consumer. For
    every consequential law state its jurisdiction, selection pressure, evidence,
    counterexample, permitted variation, operational consequence, proof burden,
    and invalidators. Distinguish current behavior, documented intent, explicit
    target, proposal, and aporia. Do not emit protocol artifacts, synthetic IDs,
    graph-closure bookkeeping, schemas, validators, compilers, or generic
    validation claims. Route durable knowledge only after doctrine; use skills
    only for recurring judgment; require explicit authority for persistence or
    creation.
