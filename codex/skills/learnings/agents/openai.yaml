policy:
  allow_implicit_invocation: true
interface:
  display_name: "Learnings"
  short_description: "Capture and admit evidence-backed learnings"
  default_prompt: "Use $learnings for repository-scoped recall, source-local capture, and explicitly authorized retired-source recovery. Evaluate the capture gate for new observations; historical imports follow retired-import.md and preserve original records rather than recapturing them. Retain the source-owned disposition, use native Ledger operations, and admit memory snapshots only after source acceptance. Do not invoke sibling source skills or a coordinator solely because Learnings activated."
