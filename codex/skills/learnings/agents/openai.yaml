policy:
  allow_implicit_invocation: true
interface:
  display_name: "Learnings"
  short_description: "Capture and admit evidence-backed learnings"
  default_prompt: "Use $learnings for repository-local recall and source-local capture after explicit, implicit, or root-owned activation. Evaluate only Learnings' capture and admission gates, retain exactly one source-owned disposition, append through Ledger only when the capture gate passes, and create a canonical memory-note projection only when admission is accepted. Do not invoke sibling source skills or a coordinator solely because Learnings activated."
