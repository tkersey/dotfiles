policy:
  allow_implicit_invocation: true
interface:
  display_name: "Footgun Finder"
  short_description: "Read-only review lens for latent misuse hazards and dangerous affordances."
  default_prompt: "Use $footgun-finder read-only. Find plausible easy-path misuse hazards, classify each with a misuse trace, separate footguns from invariants and complexity, and report prioritized findings with concrete misuse traces and mitigation handoffs. Use the full ledger only for a requested full report; preserve the enclosing review contract."
