policy:
  allow_implicit_invocation: true
interface:
  display_name: "Actuating"
  short_description: "Turn counterexamples into family-excluding constructions"
  default_prompt: "Use $actuating to implement the accepted Goal and compile cumulative counterexamples into law-preserving constructions. Keep implement, analyze, review-closeout, and the bare end-to-end route distinct: implement constructs and proves locally without review; analyze never mutates. Once review opens on a proved candidate, freeze it through the applicable complete evidence cut. Have Review Fold project and reclassify the corpus, adjudicate current findings, and capture accepted independent witnesses. Locate the first loss of guarantee and the independently chosen value, write, ordering, or authority that permits it. Before implementing, choose a discriminator that attacks that mechanism, including a valid-state-to-invalid-transition witness when implicated. Select for family exclusion, required-valid preservation, complete sanctioned-path coverage, and fewer independent semantic owners, not a preferred repair label or preservation of the incumbent. When the existing Metanoetic trigger fires, apply Glaze then Metanoetic verbatim in the same bounded challenger pass before Universalist, without an extra pass or a weaker acceptance standard; compile applicable construction obligations from a compact code-bound nomination and use Reduce only for material retirement challenges. Verify actual admission, transition preservation, source-derived coverage, required-valid behavior, claim strength, and semantic-diff authority on the exact head. Adequate native proofs need no duplicate topology report; explicit topology remains required where coverage needs it. Labels and agent-authored digests grant no authority. Preserve native/default Codex standard review, five auxiliary lenses, both scheduling modes, and five-standard-clean convergence. Add no Actuating gate, packet, or durable store."
