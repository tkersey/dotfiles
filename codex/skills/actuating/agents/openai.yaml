policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Construct, normalize paths, prove retirements, close"
  default_prompt: "Use $actuating to state OPERATE ARCHITECTONICALLY, establish the current $first-principles basis, compare all candidate families under one common mandatory obligation core, apply one bounded $metanoetic pass when an initial-high-regret or abstraction-change trigger is live, require $universalist lowering and one $reduce challenge, then let Actuating alone select the smallest arrival-order-invariant Construction and prove every retirement through deletion, successor-owner mapping, or a distinct live obligation."
