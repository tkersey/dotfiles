policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Reconcile semantic hotspots into correct architecture"
  default_prompt: "Use $actuating as a stateless reconciler over the accepted Goal, exact Git tree, current validation, CAS review receipts, and Ship/provider state. Treat each accepted bug as a counterexample to a named law. Distinguish the detection surface from the admission frontier, derive semantic hotspots only from same-law owner evidence and repository scar tissue, preserve the incumbent only when its existing owner can exclude the complete evidenced family, and otherwise recompile through First Principles, Review Fold, Universalist, one bounded Metanoetic challenge when justified, and Reduce. Select the smallest correctness-non-dominated target, state the invalid region eliminated and residual invalidity, keep it in an ephemeral Architecture Working Set, and create no Ledger gate, hotspot registry, score, threshold, or replacement workflow store."
