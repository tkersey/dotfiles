policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Reconcile bugs into convergent architecture"
  default_prompt: "Use $actuating as a stateless reconciler over the accepted Goal, exact Git tree, current validation, CAS review receipts, and Ship/provider state. Classify every review finding as entailed, strengthening, preference, new-requirement, or underdetermined before treating it as counterexample pressure. Treat elimination as a revocable theory lease scoped to an exact family and validity horizon: a current entailed witness that falsifies that scoped claim invalidates the lease, requires failed-premise localization and theory/proof re-adjudication before mutation, and cannot be answered by another unchanged-theory patch. Reissue elimination only under accepted Goal authority from an exhaustive or family-level proof plus explicit sibling predictions and probes, never repaired examples alone. Preserve Git/CAS/Ship ownership and create no Ledger gate, hotspot registry, score, threshold, receipt, or replacement workflow store."
