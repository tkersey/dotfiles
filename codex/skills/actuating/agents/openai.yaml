policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Recompile review evidence into correct-by-construction code"
  default_prompt: "Use $actuating as a level-triggered reconciler over the accepted Goal, exact Git tree, retained applicable review corpus, current validation, CAS review receipts, and Ship/provider state. Before review dispatch, derive the complete Goal-required proof inventory and require exact-head pass evidence or authority-backed non-applicability for every entry; never defer a known required proof to post-review closure. After candidate invalidation, close one cumulative evidence cut, quotient every retained finding into causal generators, fold every affected production and proof factor, and execute the smallest plausible deletion/reversion/collapse/delegation/privatization candidate against the same retained witnesses and required-valid proofs before considering addition. A passing subtractive candidate dominates additive repair. Only after subtraction fails may an unchanged-model winner use the repository-grounded actuating-direct-repair-admission/v1 packet and Actuating's pure Ledger definition. Preserve the existing Metanoetic-before-Universalist ordering and Git/CAS/Ship ownership; create no durable Actuating corpus, candidate, gate, or closure store."
