policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Reconcile architecture, realization, review, and closure"
  default_prompt: "Use $actuating as a stateless reconciler over the accepted Goal, exact Git tree, current validation, CAS review receipts, and Ship/provider state. Reconstruct the incumbent architecture from code; preserve it when closed under current obligations; otherwise recompile through First Principles, Review Fold, Universalist, one bounded Metanoetic challenge when justified, and Reduce. Keep the target in an ephemeral Architecture Working Set, realize it in Git, derive review credit only from exact current-head CAS receipts, and close only from live owner facts. Invoke no Ledger gate and create no replacement workflow store."
