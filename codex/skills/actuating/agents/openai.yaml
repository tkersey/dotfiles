policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Normalize bugs into correct-by-construction architecture"
  default_prompt: "Use $actuating as a level-triggered reconciler over the accepted Goal, exact Git tree, current validation, CAS review receipts, and Ship/provider state. Classify finding authority before counterexample pressure, quotient all applicable accepted classes into causal generators or proved exceptions, and require family-level realization rather than wound-specific patches. When preserving architecture through bug-driven direct repair—including retain-theory-reprove—build the repository-grounded actuating-direct-repair-admission/v1 packet and execute Actuating's pure Ledger definition; an invalid materialization forbids direct repair and requires architecture recompilation or blocked. Treat elimination as a revocable exact-family claim, preserve the existing Metanoetic-before-Universalist ordering, and keep Git/CAS/Ship ownership with no durable Actuating gate store, event log, receipt family, score, or replacement control plane."
