policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Compile review counterexamples into legal state spaces"
  default_prompt: "Use $actuating as a counterexample-to-construction compiler over the accepted Goal, exact Git tree, Review Fold counterexample corpus, current findings, exact-head proof inventory, CAS receipts, and Ship/provider state. A material finding invalidates the candidate and closes mutation; complete the remaining initial independent lenses against the frozen head. Before successor selection, have $review-fold project review-fold/counterexample-corpus, reclassify every historical witness against the current Goal and head, fold the complete evidence cut, and capture each newly accepted current entailed witness. Compile the basis into an invalid family, every sanctioned producer, the earliest enforceable cut, one admitted carrier, producer migrations, bypass closure, required-valid preservation, and compensator retirement. Permit only construction normalization or proved isolated restoration; actuating/direct-repair-admission applies only to the latter. Keep Metanoetic before Universalist, Reduce after carrier selection, CAS as review source authority, and the corpus as immutable witness evidence rather than current family or architecture truth. Create no durable Actuating store or additional Actuating gate."
