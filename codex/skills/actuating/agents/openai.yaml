policy:
  allow_implicit_invocation: false
interface:
  display_name: "Actuating"
  short_description: "Accumulate counterexamples, normalize constructions, review exhaustively"
  default_prompt: "Use $actuating to state OPERATE ARCHITECTONICALLY, derive the complete cumulative Counterexample Theory and causal basis, reject any local repair that introduces a semantic constructor absent from the current Construction, let $universalist nominate concrete semantic models, use one bounded $metanoetic escape when the model may be wrong, let $reduce quotient or ablate disputable factors, and let Actuating alone select and completely realize the smallest arrival-order-invariant normal form. Before Ship or fresh review, map every live production and proof mechanism to the selected Construction and retire all residue. Preserve the concurrent 1+4 wave and five consecutive standard-clean theorem."
