policy:
  allow_implicit_invocation: true
interface:
  display_name: "metanoetic"
  short_description: "Reconsider task framing; follow useful discoveries"
  default_prompt: >-
    Use $metanoetic on the current task or question. Apply the canonical passage
    unchanged and follow useful discoveries through inquiry and revision;
    no identified incumbent or advance challenger is required. Preserve user
    requirements, authority, resource limits, and evidence-based claims.
    Return the resulting work, not a recitation or invocation report.
